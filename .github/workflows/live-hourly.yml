name: Live ingest and agent run
# TRUE live operation: hourly, pulls current government readings into Supabase,
# runs the agent chain on accumulated live data, writes events / attributions /
# ranked actions back to the database the deployed API serves.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: live-ingest
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Urban Air Hack"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ingest current government readings into Supabase
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python etl/ingest_live.py
      - name: Run agent chain on live data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python agents/live_pipeline.py
