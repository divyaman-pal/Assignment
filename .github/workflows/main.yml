name: Rebuild backbone and models
# BATCH job, not the live path. Rebuilds the episode backbone from the
# Vonter/india-cpcb-aqi mirror, retrains the forecast models, and refreshes the
# bundled demo snapshot used when no API is configured.
#
# The live platform does not depend on this: readings reach Supabase hourly via
# live-hourly.yml, and the frontend now reads freshness and hotspots from the
# API rather than from the snapshot this job writes. Weekly is the right cadence
# for a retrain, and it stops a heavy DuckDB re-commit running every 6 hours.
on:
  schedule:
    - cron: "15 3 * * 0"     # Sundays 03:15 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Urban Air Hack"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the full rebuild needs duckdb/shapely/lightgbm, which the slim
      # serverless requirements.txt deliberately omits
      - run: pip install -r requirements-pipeline.txt
      - name: Rebuild pipeline on fresh data
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          # models/forecast.py trains on the live store and falls back to the
          # bundled December archive when it cannot reach it. Without this the
          # fallback fired on every run, and the STALE forecast_metrics.json it
          # wrote was then committed -- which is what failed live-hourly.yml's
          # "forecast trained on live store" check on the next hour.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python etl/fetch_data.py
          python etl/fetch_live.py
          python etl/build_live_view.py
          python etl/build_backbone.py
          python etl/apply_pois.py
          python models/forecast.py
          python models/attribution.py
          python agents/enforcement.py
          python etl/make_serve.py
          python etl/export_geo.py
      - name: Commit refreshed artifacts
        run: |
          cd ..
          git config user.name "vayu-net-bot"
          git config user.email "actions@github.com"
          git add -f "Urban Air Hack/data/vayu_serve.duckdb" "Urban Air Hack/data/"*.json \
                  "Urban Air Hack/models/lgbm_pm25_h"*.txt "Urban Air Hack/web/public/demo/" \
                  "Urban Air Hack/data/raw/live_snapshots.parquet" 2>/dev/null || true
          git add "Urban Air Hack/data/vayu_serve.duckdb" "Urban Air Hack/web/public/demo/"
          git diff --cached --quiet || git commit -m "data: automated weekly CPCB refresh + pipeline rerun"
          git push
